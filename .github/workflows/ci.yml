name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Unit tests
        run: make test
  # eval-smoke job (paths-filtered: src/, prompts, eval/datasets) is added in Phase 5.
